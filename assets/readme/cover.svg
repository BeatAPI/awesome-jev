<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Awesome JEV</title>
  <desc id="desc">A decision field turns noisy signals into four clear paths: choose, score, route, and filter. Powered by BeatAPI.</desc>
  <defs>
    <linearGradient id="shade" x1="0" x2="1">
      <stop offset="0" stop-color="#020914" stop-opacity=".62"/>
      <stop offset=".58" stop-color="#020914" stop-opacity=".18"/>
      <stop offset="1" stop-color="#020914" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <image href="decision-field.png" width="1200" height="400" preserveAspectRatio="xMidYMid slice"/>
  <rect width="720" height="400" fill="url(#shade)"/>
  <style>
    .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
  </style>
  <text x="72" y="74" class="sans" fill="#85A0FF" font-size="15" font-weight="600" letter-spacing=".8">CURATED OPEN-SOURCE JEV ECOSYSTEM</text>
  <text x="68" y="161" class="sans" fill="#F4F7FC" font-size="82" font-weight="500" letter-spacing="-3">Awesome JEV</text>
  <text x="72" y="228" class="sans" fill="#C7D0E0" font-size="24" font-weight="500">Small decisions. Serious systems.</text>
  <text x="73" y="276" class="mono" fill="#7185A8" font-size="14">CHOOSE  /  SCORE  /  ROUTE  /  FILTER</text>
  <rect x="72" y="326" width="22" height="22" fill="#3158E8"/>
  <text x="83" y="342" class="sans" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">B</text>
  <text x="107" y="343" class="sans" fill="#E9EEF7" font-size="17" font-weight="500">Powered by BeatAPI</text>
</svg>
